name: Offline maintenance validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Verified official upstream tag commits; Dependabot maintains SHA pins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check canonical shell syntax
        run: |
          for script in cog-update.sh .claude/lib/checkpoint.sh .claude/lib/lane-classify.sh scripts/build-agent-plugin.sh scripts/validate-agent-surface.sh; do
            bash -n "$script"
          done
      - name: Validate agent packaging
        run: ./scripts/validate-agent-surface.sh
      - name: Run synthetic offline tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Check path-only documentation indexes
        run: python3 scripts/doc_indexes.py --check
      - name: Check tracked files remain unchanged
        run: git diff --exit-code HEAD
